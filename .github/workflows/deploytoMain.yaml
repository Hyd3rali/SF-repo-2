 name: Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout full git history
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Salesforce CLI
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      # 3. Install Salesforce Git Delta Plugin
      - name: Install Salesforce Git Delta
        run: |
          echo y | sf plugins install sfdx-git-delta

      # 4. Generate delta package (only changed components)
      - name: Generate Delta Package
        run: |
          --from ${{ github.event.before }}
          --to ${{ github.sha }}

      # 5. Show generated package
      - name: Display Generated Package
        run: |
          echo '=== package.xml ==='
          cat delta/package/package.xml || echo 'No package.xml'
          echo '=== destructiveChanges.xml ==='
          cat delta/destructiveChanges/destructiveChanges.xml || echo 'No destructive changes'

      # 6. Create JWT key file from GitHub Secret
      - name: Create JWT Key
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          chmod 600 server.key

      # 7. Authenticate to Salesforce Production
      - name: Authenticate to Production
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --instance-url https://login.salesforce.com

      # 8. Validate deployment
      - name: Validate Deployment
        run: |
          if [ -f delta/package/package.xml ]; then
            sf project deploy validate \
              --manifest delta/package/package.xml \
              --target-org ${{ secrets.SF_USERNAME }} \
              --test-level RunLocalTests \
              --wait 120
          else
            echo 'No metadata changes detected'
          fi

      # 9. Deploy changed components
      - name: Deployment Pipeline
        run: |
          if [ -f delta/package/package.xml ]; then
            sf project deploy start \
              --manifest delta/package/package.xml \
              --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml \
              --target-org ${{ secrets.SF_USERNAME }} \
              --test-level RunLocalTests \
              --wait 120
          else
            echo 'Nothing to deploy'
          fi